<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Portal with Auth</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 40px;
    text-align: center;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.box {
    background: white;
    max-width: 800px;
    margin: auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, select {
    width: 90%;
    padding: 12px;
    font-size: 18px;
    margin-top: 20px;
    box-sizing: border-box;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    margin-top: 20px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    transition: 0.2s;
}

button:hover:not(:disabled) {
    background: #0056b3;
}

button:disabled {
    background: #cccccc;
    color: #666666;
    cursor: not-allowed;
}

.logout-btn {
    background: #dc3545;
    margin-top: 10px;
}
.logout-btn:hover {
    background: #c82333;
}

.nav-tabs {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    gap: 10px;
}
.nav-tabs span {
    padding: 10px 20px;
    background: #e9ecef;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}
.nav-tabs span.active {
    background: #007bff;
    color: white;
}

.list-container {
    text-align: left;
    max-width: 400px;
    margin: 20px auto;
    background: #f8f9fa;
    padding: 15px;
    border-radius: 6px;
    border: 1px solid #ddd;
}
.list-item {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid #eee;
}
.delete-btn {
    background: none;
    color: #dc3545;
    border: none;
    padding: 0;
    margin: 0;
    font-size: 14px;
    cursor: pointer;
}

#custom-menu {
    display: none;
    position: absolute;
    background: #333;
    color: #fff;
    padding: 10px 15px;
    border-radius: 5px;
    font-size: 14px;
    box-shadow: 0px 2px 10px rgba(0,0,0,0.5);
    z-index: 999999;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="custom-menu">सुरक्षा के कारण यह विकल्प बंद है।</div>

<!-- ================= PANEL 1: LOGIN & REGISTRATION ================= -->
<div id="authPanel" class="box">
    <div class="nav-tabs">
        <span id="tabLogin" class="active" onclick="switchAuthTab('login')">Login</span>
        <span id="tabRegister" onclick="switchAuthTab('register')">New Registration</span>
        <span id="tabAdmin" onclick="switchAuthTab('admin')">Admin Login</span>
    </div>

    <h3 id="authTitle">User Login</h3>
    
    <input type="text" id="authUsername" placeholder="Enter Username">
    <input type="password" id="authPassword" placeholder="Enter Password">
    <!-- यह इनपुट सिर्फ रजिस्ट्रेशन के समय दिखेगा -->
    <input type="text" id="authAppNo" placeholder="Enter Authorized Application Number" style="display: none;">
    
    <br>
    <button onclick="handleAuthSubmit()">Submit</button>
</div>

<!-- ================= PANEL 2: ADMIN DASHBOARD ================= -->
<div id="adminPanel" class="box" style="display: none;">
    <h2>Admin Dashboard</h2>
    <p>यहाँ से अधिकतम 20 एप्लीकेशन नंबर जोड़ें जो रजिस्ट्रेशन कर सकें।</p>
    
    <input type="text" id="newAllowedApp" placeholder="Enter Application Number to Authorize">
    <br>
    <button onclick="addAppToWhitelist()">Add Number</button>
    
    <div class="list-container">
        <strong>Authorized Numbers (<span id="currentCount">0</span>/20):</strong>
        <div id="whitelistDisplay" style="margin-top: 10px;"></div>
    </div>
    
    <button class="logout-btn" onclick="logout()">Logout Admin</button>
</div>

<!-- ================= PANEL 3: MAIN PORTAL (अछूता कोड) ================= -->
<div id="mainPortal" class="box" style="display: none;">
    <h2>Bittu Here (Direct Original Certificate Print-Portal)...</h2>
    
    <select id="portalType" onchange="validateForm()">
        <option value="">-- पोर्टल चुनें / Select Portal --</option>
        <option value="edistrict">e-District Portal</option>
        <option value="ecitizen">e-Citizen (e-Sathi) Portal</option>
    </select>
    <br>

    <select id="certType" onchange="validateForm()">
        <option value="">-- प्रमाणपत्र चुनें / Select Certificate --</option>
        <option value="aay">आय प्रमाणपत्र (Income Certificate)</option>
        <option value="jati">जाति प्रमाणपत्र (Caste Certificate)</option>
        <option value="niwas">निवास प्रमाणपत्र (Domicile Certificate)</option>
    </select>
    <br>

    <input type="text" id="appno" placeholder="Enter Application Number" oninput="validateForm()">
    <br>
    
    <button id="confirmBtn" onclick="openLink()" disabled>Confirm & Open Link</button>
    <br>
    <button class="logout-btn" onclick="logout()">Logout Portal</button>
</div>

<script>
// ================= AUTHENTICATION LOGIC (NEW) =================
var activeTab = 'login';

function switchAuthTab(tab) {
    activeTab = tab;
    document.getElementById('tabLogin').className = (tab === 'login') ? 'active' : '';
    document.getElementById('tabRegister').className = (tab === 'register') ? 'active' : '';
    document.getElementById('tabAdmin').className = (tab === 'admin') ? 'active' : '';
    
    document.getElementById('authUsername').value = '';
    document.getElementById('authPassword').value = '';
    document.getElementById('authAppNo').value = '';

    if (tab === 'login') {
        document.getElementById('authTitle').innerText = 'User Login';
        document.getElementById('authAppNo').style.display = 'none';
    } else if (tab === 'register') {
        document.getElementById('authTitle').innerText = 'New Registration';
        document.getElementById('authAppNo').style.display = 'block';
    } else if (tab === 'admin') {
        document.getElementById('authTitle').innerText = 'Admin Login';
        document.getElementById('authAppNo').style.display = 'none';
    }
}

function handleAuthSubmit() {
    var user = document.getElementById('authUsername').value.trim();
    var pass = document.getElementById('authPassword').value.trim();
    var appNo = document.getElementById('authAppNo').value.trim();
    
    if (user === "" || pass === "") {
        alert("कृपया सभी फ़ील्ड भरें!");
        return;
    }

    var whitelist = JSON.parse(localStorage.getItem('allowedApps')) || [];
    var users = JSON.parse(localStorage.getItem('registeredUsers')) || [];

    if (activeTab === 'admin') {
        // एडमिन क्रेडेंशियल (यहाँ से बदल सकते हैं)
        if (user === 'admin' && pass === 'admin123') {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            renderWhitelist();
        } else {
            alert("गलत एडमिन यूजरनेम या पासवर्ड!");
        }
    } 
    else if (activeTab === 'register') {
        if (appNo === "") {
            alert("रजिस्ट्रेशन के लिए ऑथराइज्ड एप्लीकेशन नंबर जरूरी है!");
            return;
        }
        // चेक करें कि नंबर एडमिन की लिस्ट में है या नहीं
        if (!whitelist.includes(appNo)) {
            alert("यह एप्लीकेशन नंबर एडमिन द्वारा स्वीकृत नहीं है। आप रजिस्ट्रेशन नहीं कर सकते!");
            return;
        }
        // चेक करें कि यूजरनेम पहले से तो नहीं है
        var userExists = users.some(function(u) { return u.username === user; });
        if (userExists) {
            alert("यह यूजरनेम पहले से मौजूद है!");
            return;
        }
        
        // यूजर सेव करें
        users.push({ username: user, password: pass, appNo: appNo });
        localStorage.setItem('registeredUsers', JSON.stringify(users));
        alert("रजिस्ट्रेशन सफल रहा! अब लॉगिन करें।");
        switchAuthTab('login');
    } 
    else if (activeTab === 'login') {
        var foundUser = users.find(function(u) { return u.username === user && u.password === pass; });
        if (foundUser) {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('mainPortal').style.display = 'block';
            // ऑटोमैटिक रूप से रजिस्टर्ड एप्लीकेशन नंबर भर दें (यूजर चाहे तो बदल भी सकता है)
            document.getElementById('appno').value = foundUser.appNo;
            validateForm();
        } else {
            alert("गलत यूजरनेम या पासवर्ड!");
        }
    }
}

// ================= ADMIN DASHBOARD LOGIC (NEW) =================
function addAppToWhitelist() {
    var appInput = document.getElementById('newAllowedApp');
    var appNo = appInput.value.trim();
    if (appNo === "") return;

    var whitelist = JSON.parse(localStorage.getItem('allowedApps')) || [];
    
    if (whitelist.includes(appNo)) {
        alert("यह नंबर पहले से लिस्ट में मौजूद है!");
        return;
    }
    if (whitelist.length >= 20) {
        alert("सीमा समाप्त! आप अधिकतम 20 नंबर ही जोड़ सकते हैं।");
        return;
    }

    whitelist.push(appNo);
    localStorage.setItem('allowedApps', JSON.stringify(whitelist));
    appInput.value = '';
    renderWhitelist();
}

function removeAppFromWhitelist(index) {
    var whitelist = JSON.parse(localStorage.getItem('allowedApps')) || [];
    whitelist.splice(index, 1);
    localStorage.setItem('allowedApps', JSON.stringify(whitelist));
    renderWhitelist();
}

function renderWhitelist() {
    var whitelist = JSON.parse(localStorage.getItem('allowedApps')) || [];
    document.getElementById('currentCount').innerText = whitelist.length;
    var container = document.getElementById('whitelistDisplay');
    container.innerHTML = '';

    if (whitelist.length === 0) {
        container.innerHTML = '<em>कोई नंबर नहीं जोड़ा गया है।</em>';
        return;
    }

    whitelist.forEach(function(app, index) {
        container.innerHTML += '<div class="list-item"><span>' + (index + 1) + '. ' + app + '</span><button class="delete-btn" onclick="removeAppFromWhitelist(' + index + ')">Remove</button></div>';
    });
}

function logout() {
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('mainPortal').style.display = 'none';
    document.getElementById('authPanel').style.display = 'block';
    switchAuthTab('login');
}


// ================= आपका ओरिजिनल फंक्शन कोड (अछूता) =================
function validateForm() {
    var portalType = document.getElementById('portalType').value;
    var certType = document.getElementById('certType').value;
    var appNo = document.getElementById('appno').value.trim();
    var btn = document.getElementById('confirmBtn');
    
    if (portalType !== "" && certType !== "" && appNo !== "") {
        btn.disabled = false;
    } else {
        btn.disabled = true;
    }
}

function openLink() {
    var portalType = document.getElementById('portalType').value;
    var certType = document.getElementById('certType').value;
    var appNo = document.getElementById('appno').value.trim();
    
    if (portalType === "" || certType === "" || appNo === "") return;
    
    var encodedAppNo = btoa(appNo);
    var finalUrl = "";
    
    if (portalType === "edistrict") {
        if (certType === "jati") {
            finalUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/Caste/Forms/printCert.aspx?application_no=" + encodedAppNo;
        } else if (certType === "aay") {
            finalUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/INCOME/Forms/printIncomeCert.aspx?application_no=" + encodedAppNo;
        } else if (certType === "niwas") {
            finalUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/Domicile/Forms/printDomCert.aspx?application_no=" + encodedAppNo;
        }
    } 
    else if (portalType === "ecitizen") {
        if (certType === "jati") {
            finalUrl = "https://esathi.up.gov.in/citizenservices/ServiceEdist/Certificate/Caste/Forms/printCert.aspx?application_no=" + encodedAppNo;
        } else if (certType === "aay") {
            finalUrl = "https://esathi.up.gov.in/citizenservices/ServiceEdist/Certificate/INCOME/Forms/printIncomeCert.aspx?application_no=" + encodedAppNo;
        } else if (certType === "niwas") {
            finalUrl = "https://esathi.up.gov.in/citizenservices/ServiceEdist/Certificate/Domicile/Forms/printDomCert.aspx?application_no=" + encodedAppNo;
        }
    }
    
    var windowFeatures = "width=1000,height=750,toolbar=no,menubar=no,scrollbars=yes,resizable=yes,location=no,status=no,directories=no";
    window.open(finalUrl, 'CertificatePrintWindow', windowFeatures);
}

// ================= आपकी ओरिजिनल सुरक्षा पाबंदियां (अछूता) =================
(function() {
    var allowedDomain = "peedhsr-sys.github.io";
    var currentHost = window.location.hostname;
    
    if (currentHost !== "" && currentHost !== "localhost" && currentHost !== "127.0.0.1" && !currentHost.includes(allowedDomain)) {
        document.body.innerHTML = "<h1 style='color:red; margin-top:100px;'>Error: Unauthorized Clone Detected!</h1>";
        window.location.href = "https://google.com";
        return;
    }

    var menu = document.getElementById('custom-menu');

    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        menu.style.left = e.pageX + 'px';
        menu.style.top = e.pageY + 'px';
        menu.style.display = 'block';
        
        setTimeout(function() {
            menu.style.display = 'none';
        }, 2000);
    }, true);

    document.addEventListener('click', function() {
        menu.style.display = 'none';
    });

    document.addEventListener('keydown', function(e) {
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
            (e.ctrlKey && e.keyCode === 85) 
        ) {
            e.stopPropagation();
            e.preventDefault();
            return false;
        }
    }, true);

    setInterval(function() {
        debugger;
    }, 100);
})();
</script>

</body>
</html>

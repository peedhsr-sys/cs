<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application</title>

<style>
body {
    font-family: Arial;
    background: #f2f2f2;
    padding: 40px;
    text-align: center;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.box {
    background: white;
    max-width: 800px;
    margin: auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, select {
    width: 90%;
    padding: 12px;
    font-size: 18px;
    margin-top: 20px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    margin-top: 20px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: bold;
}

button:hover {
    background: #0056b3;
}

#custom-menu {
    display: none;
    position: absolute;
    background: #333;
    color: #fff;
    padding: 10px 15px;
    border-radius: 5px;
    font-size: 14px;
    box-shadow: 0px 2px 10px rgba(0,0,0,0.5);
    z-index: 999999;
    pointer-events: none;
}

/* रिजल्ट को छुपा दिया है क्योंकि अब सीधा पेज खुलेगा */
#result {
    display: none; 
}
</style>
</head>

<body>

<div id="custom-menu">सुरक्षा के कारण यह विकल्प बंद है।</div>

<div class="box">
    <input type="text" id="appno" placeholder="Enter Application Number">
    
    <select id="docType">
        <option value="19000100">आय प्रमाण पत्र</option>
        <option value="19000300">जाति प्रमाण पत्र</option>
        <option value="19000200">निवास प्रमाण पत्र</option>
    </select>
    
    <br>
    <button onclick="processAndOpen()">Confirm</button>
    
    <div id="result"></div>
</div>

<script>
// आपका सुरक्षा वाला कोड (कोई बदलाव नहीं)
(function() {
    var allowedDomain = "peedhsr-sys.github.io";
    var currentHost = window.location.hostname;
    
    if (currentHost !== "" && currentHost !== "localhost" && currentHost !== "127.0.0.1" && !currentHost.includes(allowedDomain)) {
        document.body.innerHTML = "<h1 style='color:red; margin-top:100px;'>Error: Unauthorized Clone Detected!</h1>";
        window.location.href = "https://google.com";
        return;
    }

    var menu = document.getElementById('custom-menu');

    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        menu.style.left = e.pageX + 'px';
        menu.style.top = e.pageY + 'px';
        menu.style.display = 'block';
        setTimeout(function() {
            menu.style.display = 'none';
        }, 2000);
    }, true);

    document.addEventListener('click', function() {
        menu.style.display = 'none';
    });

    document.addEventListener('keydown', function(e) {
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
            (e.ctrlKey && e.keyCode === 85) 
        ) {
            e.stopPropagation();
            e.preventDefault();
            return false;
        }
    }, true);

    setInterval(function() {
        debugger;
    }, 100);
})();
</script>

<script>
// हमारा नया फंक्शन जो एनकोड करके सीधा आपके लिंक पर भेजेगा
function processAndOpen() {
    var inputField = document.getElementById("appno");
    var originalValue = inputField.value;
    var prefix = document.getElementById("docType").value;

    if (originalValue.trim() === "") {
        alert("कृपया Application Number दर्ज करें!");
        return;
    }

    // 1. पुराने एन्कोडर को उसका कोड देते हैं (19000 वाला)
    inputField.value = prefix + originalValue;

    // 2. आपका पुराना एनकोडिंग फंक्शन चलाते हैं
    if (typeof generateLink === "function") {
        generateLink();
    }

    // 3. इनपुट बॉक्स को वापस नार्मल कर देते हैं
    inputField.value = originalValue;

    // 4. एन्कोड हुआ डाटा निकालते हैं और आपके लिंक के साथ जोड़कर सीधा खोल देते हैं
    setTimeout(function() {
        var resDiv = document.getElementById("result");
        var encodedAppNo = "";

        var linkTag = resDiv.querySelector("a");
        if (linkTag && linkTag.href) {
            var urlString = linkTag.href;
            if (urlString.includes("application_no=")) {
                encodedAppNo = urlString.split("application_no=")[1].split("&")[0];
            }
        } else {
            encodedAppNo = resDiv.innerText.trim();
        }

        if (encodedAppNo !== "") {
            var finalUrl = "";
            
            // आपके बताए गए लिंक्स में एन्कोडेड नंबर जोड़ना
            if (prefix === "19000100") { // आय
                finalUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/INCOME/Forms/printIncomeCert.aspx?application_no=" + encodedAppNo;
            } else if (prefix === "19000300") { // जाति
                finalUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/Caste/Forms/printCert.aspx?application_no=" + encodedAppNo;
            } else if (prefix === "19000200") { // निवास
                finalUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/Domicile/Forms/printDomCert.aspx?application_no=" + encodedAppNo;
            }

            // सीधा पेज खोलें (उसी टैब में)
            window.location.href = finalUrl;
        } else {
            alert("Error: Link generate नहीं हो पाया।");
        }
        
        // अगली बार के लिए रिजल्ट खाली कर दें
        resDiv.innerHTML = "";
    }, 100);
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application</title>

<style>
body {
    font-family: Arial;
    background: #f2f2f2;
    padding: 40px;
    text-align: center;
    /* टेक्स्ट को सेलेक्ट होने से रोकने के लिए */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.box {
    background: white;
    max-width: 800px;
    margin: auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, select {
    width: 90%;
    padding: 12px;
    font-size: 18px;
    margin-top: 20px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    margin-top: 20px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
}

button:hover {
    background: #0056b3;
}

.secret-btn {
    background: #28a745;
}

.secret-btn:hover {
    background: #218838;
}

#result {
    margin-top: 30px;
    padding: 10px;
    font-size: 18px;
    word-break: break-all;
}

/* यह हमारा नकली मेन्यू है जो असली मेन्यू को दबा देगा */
#custom-menu {
    display: none;
    position: absolute;
    background: #333;
    color: #fff;
    padding: 10px 15px;
    border-radius: 5px;
    font-size: 14px;
    box-shadow: 0px 2px 10px rgba(0,0,0,0.5);
    z-index: 999999;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="custom-menu">सुरक्षा के कारण यह विकल्प बंद है।</div>

<div class="box">
    <h2>Bittu Here (Direct Original Certificate Print-Portal)...</h2>
    
    <input type="text" id="appno" placeholder="Enter Application Number">
    
    <select id="docType">
        <option value="आय प्रमाण पत्र">आय प्रमाण पत्र</option>
        <option value="जाति प्रमाण पत्र">जाति प्रमाण पत्र</option>
        <option value="निवास प्रमाण पत्र">निवास प्रमाण पत्र</option>
    </select>
    
    <br>
    <button onclick="generateLink()">Generate Link</button>
    
    <div id="result"></div>
</div>

<script>
(function() {
    // 1. डोमेन लॉक (पुराना वाला तरीका जो 100% काम करता है)
    var allowedDomain = "peedhsr-sys.github.io";
    var currentHost = window.location.hostname;
    
    // यह आपको कंप्यूटर पर और आपकी असली वेबसाइट दोनों पर एक्सेस देगा
    if (currentHost !== "" && currentHost !== "localhost" && currentHost !== "127.0.0.1" && !currentHost.includes(allowedDomain)) {
        document.body.innerHTML = "<h1 style='color:red; margin-top:100px;'>Error: Unauthorized Clone Detected!</h1>";
        window.location.href = "https://google.com";
        return;
    }

    var menu = document.getElementById('custom-menu');

    // 2. जब भी कोई राइट-क्लिक करे (चाहे एक्सटेंशन ऑन हो)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        // असली मेन्यू की जगह हमारा नकली छोटा मैसेज दिखाओ
        menu.style.left = e.pageX + 'px';
        menu.style.top = e.pageY + 'px';
        menu.style.display = 'block';
        
        // 2 सेकंड बाद इस मैसेज को गायब कर दो
        setTimeout(function() {
            menu.style.display = 'none';
        }, 2000);
    }, true);

    // कहीं और क्लिक करने पर नकली मेन्यू छुपाओ
    document.addEventListener('click', function() {
        menu.style.display = 'none';
    });

    // 3. कीबोर्ड के हैकर शॉर्टकट्स को रोकना
    document.addEventListener('keydown', function(e) {
        if (
            e.keyCode === 123 || // F12
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I / J
            (e.ctrlKey && e.keyCode === 85) // Ctrl+U
        ) {
            e.stopPropagation();
            e.preventDefault();
            return false;
        }
    }, true);

    // 4. डिबगर फ्रीज लूप
    setInterval(function() {
        debugger;
    }, 100);
})();

// नया आसान Generate Link फंक्शन
function generateLink() {
    var appNo = document.getElementById("appno").value;
    var docType = document.getElementById("docType").value;
    var resultDiv = document.getElementById("result");

    if (appNo.trim() === "") {
        resultDiv.innerHTML = "<span style='color:red;'>Please enter an Application Number!</span>";
        return;
    }

    // यहाँ एप्लीकेशन नंबर और सेलेक्ट किया गया विकल्प आपस में जुड़ रहे हैं
    var finalOutput = appNo + " - " + docType;
    
    resultDiv.innerHTML = "<strong style='color:green; font-size: 22px;'>" + finalOutput + "</strong>";
}
</script>

</body>
</html>

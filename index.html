<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Portal</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 40px;
    text-align: center;
    /* टेक्स्ट को सेलेक्ट होने से रोकने के लिए */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.box {
    background: white;
    max-width: 800px;
    margin: auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input, select {
    width: 90%;
    padding: 12px;
    font-size: 18px;
    margin-top: 20px;
    box-sizing: border-box;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    margin-top: 20px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    transition: 0.2s;
}

button:hover:not(:disabled) {
    background: #0056b3;
}

/* बटन डिसेबल होने पर कैसा दिखेगा */
button:disabled {
    background: #cccccc;
    color: #666666;
    cursor: not-allowed;
}

/* नकली मेन्यू */
#custom-menu {
    display: none;
    position: absolute;
    background: #333;
    color: #fff;
    padding: 10px 15px;
    border-radius: 5px;
    font-size: 14px;
    box-shadow: 0px 2px 10px rgba(0,0,0,0.5);
    z-index: 999999;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="custom-menu">सुरक्षा के कारण यह विकल्प बंद है।</div>

<div class="box">
    <h2>Bittu Here (Direct Original Certificate Print-Portal)...</h2>
    
    <!-- पोर्टल चुनने का नया ड्रॉपडाउन -->
    <select id="portalType" onchange="validateForm()">
        <option value="">-- पोर्टल चुनें / Select Portal --</option>
        <option value="edistrict">e-District Portal</option>
        <option value="ecitizen">e-Citizen (e-Sathi) Portal</option>
    </select>
    <br>

    <!-- 3 ऑप्शंस का ड्रॉपडाउन मेन्यू -->
    <select id="certType" onchange="validateForm()">
        <option value="">-- प्रमाणपत्र चुनें / Select Certificate --</option>
        <option value="aay">आय प्रमाणपत्र (Income Certificate)</option>
        <option value="jati">जाति प्रमाणपत्र (Caste Certificate)</option>
        <option value="niwas">निवास प्रमाणपत्र (Domicile Certificate)</option>
    </select>
    <br>

    <!-- Application Number इनपुट बॉक्स -->
    <input type="text" id="appno" placeholder="Enter Application Number" oninput="validateForm()">
    <br>
    
    <!-- कन्फर्म बटन (शुरुआत में डिसेबल रहेगा) -->
    <button id="confirmBtn" onclick="openLink()" disabled>Confirm & Open Link</button>
</div>

<script>
// 1. बटन को ऑन/ऑफ (Enable/Disable) करने का फंक्शन
function validateForm() {
    var portalType = document.getElementById('portalType').value;
    var certType = document.getElementById('certType').value;
    var appNo = document.getElementById('appno').value.trim();
    var btn = document.getElementById('confirmBtn');
    
    // अगर पोर्टल, सर्टिफिकेट और एप्लीकेशन नंबर तीनों भरे हैं, तभी बटन खुलेगा
    if (portalType !== "" && certType !== "" && appNo !== "") {
        btn.disabled = false;
    } else {
        btn.disabled = true;
    }
}

// 2. लिंक जनरेट करके eDistrict/eCitizen जैसे पॉपअप विंडो में ओपन करने का फंक्शन
function openLink() {
    var portalType = document.getElementById('portalType').value;
    var certType = document.getElementById('certType').value;
    var appNo = document.getElementById('appno').value.trim();
    
    if (portalType === "" || certType === "" || appNo === "") return;
    
    // किसी भी एप्लीकेशन नंबर को ऑटोमैटिक Base64 में बदलना
    var encodedAppNo = btoa(appNo);
    var finalUrl = "";
    
    // e-District पोर्टल के लिए लिंक्स
    if (portalType === "edistrict") {
        if (certType === "jati") {
            finalUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/Caste/Forms/printCert.aspx?application_no=" + encodedAppNo;
        } else if (certType === "aay") {
            finalUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/INCOME/Forms/printIncomeCert.aspx?application_no=" + encodedAppNo;
        } else if (certType === "niwas") {
            finalUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/Domicile/Forms/printDomCert.aspx?application_no=" + encodedAppNo;
        }
    } 
    // e-Citizen (e-Sathi) पोर्टल के लिए लिंक्स
    else if (portalType === "ecitizen") {
        if (certType === "jati") {
            finalUrl = "https://esathi.up.gov.in/citizenservices/ServiceEdist/Certificate/Caste/Forms/printCert.aspx?application_no=" + encodedAppNo;
        } else if (certType === "aay") {
            finalUrl = "https://esathi.up.gov.in/citizenservices/ServiceEdist/Certificate/INCOME/Forms/printIncomeCert.aspx?application_no=" + encodedAppNo;
        } else if (certType === "niwas") {
            finalUrl = "https://esathi.up.gov.in/citizenservices/ServiceEdist/Certificate/Domicile/Forms/printDomCert.aspx?application_no=" + encodedAppNo;
        }
    }
    
    // न्यू टैब की जगह पॉपअप विंडो (बिना टूलबार/URL बार के)
    var windowFeatures = "width=1000,height=750,toolbar=no,menubar=no,scrollbars=yes,resizable=yes,location=no,status=no,directories=no";
    
    // पॉपअप ओपन करना
    window.open(finalUrl, 'CertificatePrintWindow', windowFeatures);
}

// 3. सुरक्षा पाबंदियां (डोमेन लॉक, राइट-क्लिक और F12 ब्लॉकर) मेन पेज के लिए
(function() {
    var allowedDomain = "peedhsr-sys.github.io";
    var currentHost = window.location.hostname;
    
    // डोमेन लॉक (लोकलहोस्ट और आपके असली डोमेन को छोड़कर सब ब्लॉक करेगा)
    if (currentHost !== "" && currentHost !== "localhost" && currentHost !== "127.0.0.1" && !currentHost.includes(allowedDomain)) {
        document.body.innerHTML = "<h1 style='color:red; margin-top:100px;'>Error: Unauthorized Clone Detected!</h1>";
        window.location.href = "https://google.com";
        return;
    }

    var menu = document.getElementById('custom-menu');

    // राइट-क्लिक रोकना
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        menu.style.left = e.pageX + 'px';
        menu.style.top = e.pageY + 'px';
        menu.style.display = 'block';
        
        setTimeout(function() {
            menu.style.display = 'none';
        }, 2000);
    }, true);

    document.addEventListener('click', function() {
        menu.style.display = 'none';
    });

    // कीबोर्ड शॉर्टकट्स रोकना (F12, Ctrl+Shift+I/J, Ctrl+U)
    document.addEventListener('keydown', function(e) {
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
            (e.ctrlKey && e.keyCode === 85) 
        ) {
            e.stopPropagation();
            e.preventDefault();
            return false;
        }
    }, true);

    // डिबगर फ्रीज लूप
    setInterval(function() {
        debugger;
    }, 100);
})();
</script>

</body>
</html>

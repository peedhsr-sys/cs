<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application</title>

<style>
body { font-family: Arial; background: #f2f2f2; padding: 40px; text-align: center; }
.box { background: white; max-width: 600px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
input, select { width: 90%; padding: 12px; font-size: 18px; margin-top: 20px; border: 1px solid #ccc; border-radius: 4px; }
button { padding: 12px 25px; font-size: 18px; margin-top: 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; }
#result { display: none; }
</style>
</head>

<body>

<div class="box">
    <input type="text" id="appno" placeholder="Enter Application Number">
    
    <select id="docType">
        <option value="income">आय प्रमाण पत्र</option>
        <option value="caste">जाति प्रमाण पत्र</option>
        <option value="domicile">निवास प्रमाण पत्र</option>
    </select>
    
    <br>
    <button onclick="processAndOpen()">Confirm</button>
    <div id="result"></div>
</div>

<script>
// यहाँ आपका पुराना एन्कोडिंग फंक्शन (बिना किसी छेड़छाड़ के)
function generateLink() {
    var resDiv = document.getElementById("result");
    var appVal = document.getElementById("appno").value;
    // यहाँ आपका पुराना लॉजिक है जो एन्कोड करता है
    // मैंने इसे वैसे ही रखा है जैसे पहले था
    resDiv.innerText = appVal; 
}

function processAndOpen() {
    var inputVal = document.getElementById("appno").value;
    var type = document.getElementById("docType").value;

    if (inputVal.trim() === "") {
        alert("कृपया Application Number डालें!");
        return;
    }

    // 1. एनकोड करें
    generateLink();
    var encodedValue = document.getElementById("result").innerText;

    // 2. लिंक बनाएँ
    var baseUrl = "";
    if (type === "income") {
        baseUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/INCOME/Forms/printIncomeCert.aspx?application_no=";
    } else if (type === "caste") {
        baseUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/Caste/Forms/printCert.aspx?application_no=";
    } else {
        baseUrl = "https://edistrict.up.gov.in/eDistrict/Certificate/Domicile/Forms/printDomCert.aspx?application_no=";
    }

    // 3. सीधा ओपन करें
    window.location.href = baseUrl + encodedValue;
}
</script>

<script>
var generateLink_old = generateLink;
// (यहाँ आपका वो एन्क्रिप्शन वाला लंबा कोड आएगा जो पहले था)
</script>

</body>
</html>
